name: a11y

# 画面のアクセシビリティ（axe-core・WCAG 2.x の A と AA）。本番ビルドを next start で開き、ライトとダークで調べる。
# 実キーは不要（ログイン画面は playwright.config.ts の偽の Supabase の環境変数で開く）
on:
  pull_request:
  push:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
