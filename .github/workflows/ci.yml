name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck（next typegen 込み）・lint・テスト・コントラスト。実キーは不要
      - run: npm run check
      # 評価ランナーが壊れていないことを毎回確かめる（--fake: 実 API を呼ばず、3つの評価セットを偽物で最後まで回す。実キーは不要）
      - run: npm run --silent eval -- --set=all --fake > /dev/null
      # 比較表が、リポジトリの結果ファイル（eval/results）を読めること
      - run: npm run --silent eval:compare > /dev/null
